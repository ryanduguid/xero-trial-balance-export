name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, attest and publish
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require a release-ready tag and repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use canonical vMAJOR.MINOR.PATCH form." >&2
            exit 1
          fi
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          main_commit="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          test "$main_commit" = "$GITHUB_SHA"
          test "$(sed -n '1p' RELEASE_NOTES.md)" = "# $GITHUB_REF_NAME"
          existing_release_ids="$(gh api --paginate \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")"
          if [[ -n "$existing_release_ids" ]]; then
            echo "A release for $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "The checked-out tracked tree is not clean." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Run offline regression checks
        run: python -B -m unittest discover -s tests -v

      - name: Build deterministic source archives
        env:
          TZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python tools/build_release_archives.py \
            --commit "$GITHUB_SHA" \
            --prefix "xero-trial-balance-export-$version/" \
            --output-base "dist/xero-trial-balance-export-$version"

      - name: Generate SPDX SBOM for the ZIP archive
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/xero-trial-balance-export-${{ steps.release.outputs.version }}.zip
          format: spdx-json
          syft-version: v1.51.0
          output-file: dist/xero-trial-balance-export-${{ steps.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write and verify SHA-256 checksums
        run: |
          (cd dist && sha256sum *.zip *.tar.gz *.spdx.json > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS

      - name: Attest the ZIP SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/xero-trial-balance-export-${{ steps.release.outputs.version }}.zip
          sbom-path: dist/xero-trial-balance-export-${{ steps.release.outputs.version }}.spdx.json

      - name: Re-check the remote tag and main immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag_commit="$(git ls-remote \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG^{}" | cut -f1)"
          remote_main_commit="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          test -n "$remote_tag_commit"
          test "$remote_tag_commit" = "$EXPECTED_COMMIT"
          test "$remote_main_commit" = "$EXPECTED_COMMIT"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"

      - name: Create, verify and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --latest \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md

          release_id="$(python tools/find_draft_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --attempts 5 \
            --delay-seconds 5)"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > /tmp/draft-release.json
          jq -e --arg tag "$TAG" \
            '.draft == true and .tag_name == $tag and .name == $tag' \
            /tmp/draft-release.json >/dev/null
          jq -j '.body' /tmp/draft-release.json > /tmp/draft-release-notes
          diff -u RELEASE_NOTES.md /tmp/draft-release-notes

          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' /tmp/draft-release.json | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "The draft release does not contain the exact asset set." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi
          (
            cd dist
            for file in *; do
              printf '%s\tsha256:%s\n' "$file" "$(sha256sum "$file" | cut -d' ' -f1)"
            done
          ) | LC_ALL=C sort > /tmp/expected-digests
          jq -r '.assets[] | [.name, .digest] | @tsv' /tmp/draft-release.json \
            | LC_ALL=C sort > /tmp/draft-digests
          diff -u /tmp/expected-digests /tmp/draft-digests

          remote_tag_commit="$(git ls-remote \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG^{}" | cut -f1)"
          remote_main_commit="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          test "$remote_tag_commit" = "$EXPECTED_COMMIT"
          test "$remote_main_commit" = "$EXPECTED_COMMIT"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"

          gh api --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -f make_latest=true \
            >/dev/null

          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > /tmp/published-release.json
          jq -e --arg tag "$TAG" \
            '.draft == false and .prerelease == false and .immutable == true
             and .tag_name == $tag and .name == $tag' \
            /tmp/published-release.json >/dev/null
          jq -j '.body' /tmp/published-release.json > /tmp/published-release-notes
          diff -u RELEASE_NOTES.md /tmp/published-release-notes
          jq -r '.assets[] | [.name, .digest] | @tsv' /tmp/published-release.json \
            | LC_ALL=C sort > /tmp/published-digests
          diff -u /tmp/expected-digests /tmp/published-digests
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isLatest > /tmp/release-list.json
          jq -e --arg tag "$TAG" \
            'any(.[]; .tagName == $tag and .isLatest == true)' \
            /tmp/release-list.json >/dev/null
          published_tag_commit="$(git ls-remote \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG^{}" | cut -f1)"
          published_main_commit="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          test "$published_tag_commit" = "$EXPECTED_COMMIT"
          test "$published_main_commit" = "$EXPECTED_COMMIT"

          release_verified=false
          for attempt in 1 2 3 4 5; do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"; then
              release_verified=true
              break
            fi
            sleep 5
          done
          test "$release_verified" = true
          for file in dist/*; do
            asset_verified=false
            for attempt in 1 2 3 4 5; do
              if gh release verify-asset "$TAG" "$file" --repo "$GITHUB_REPOSITORY"; then
                asset_verified=true
                break
              fi
              sleep 5
            done
            test "$asset_verified" = true
          done
